name: Milestone release

# Closing a roadmap milestone named "vX.Y.Z – Name" publishes release vX.Y.Z
# from main (merge dev into main first).
# The milestone's closed issues and merged PRs become the release notes.
# See ROADMAP.md.
on:
  milestone:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.milestone.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: check milestone
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Check title, open issues and tag
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Milestone fields reach the shell only through the environment.
          TITLE: ${{ github.event.milestone.title }}
          NUMBER: ${{ github.event.milestone.number }}
        run: |
          set -euo pipefail
          if [[ ! "$TITLE" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)([[:space:]]|$) ]]; then
            echo "::notice::Milestone '$TITLE' has no version in its title; no release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${BASH_REMATCH[1]}"

          # Read the live count: the event payload may predate a last-second change.
          open="$(gh api "repos/$GH_REPO/milestones/$NUMBER" --jq .open_issues)"
          if [ "$open" != "0" ]; then
            echo "::error::Milestone '$TITLE' still has $open open issue(s) or PR(s). Reopen it, finish them, and close it again."
            exit 1
          fi

          if gh api "repos/$GH_REPO/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Collect release notes
        id: notes
        if: steps.check.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ github.event.milestone.title }}
          DESCRIPTION: ${{ github.event.milestone.description }}
        run: |
          set -euo pipefail
          {
            echo "## $TITLE"
            if [ -n "$DESCRIPTION" ]; then echo; echo "$DESCRIPTION"; fi
            echo
            echo "### Features and fixes"
            gh issue list --milestone "$TITLE" --state closed --limit 500 \
              --json number,title --jq '.[] | "- \(.title) (#\(.number))"'
            echo
            echo "### Merged pull requests"
            gh pr list --search "milestone:\"$TITLE\" is:merged" --state merged --limit 500 \
              --json number,title,author --jq '.[] | "- \(.title) (#\(.number), @\(.author.login))"'
          } > notes.md
          # Random delimiter: issue titles are user-controlled and must not end the block.
          delim="NOTES_$(openssl rand -hex 16)"
          { echo "notes<<$delim"; cat notes.md; echo "$delim"; } >> "$GITHUB_OUTPUT"

  release:
    name: start release on main
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      NOTES: ${{ needs.prepare.outputs.notes }}
    steps:
      # The milestone event runs on the default branch (dev). Releases are built
      # and tagged from main, so the Release workflow is started on main.
      - name: Run the Release workflow on main
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run release.yml --ref main -f version="$VERSION" -f notes="$NOTES"
          # gh workflow run returns at once; find the run it started and follow it,
          # so this job fails when the release fails.
          run=""
          for _ in $(seq 1 30); do
            run="$(gh run list --workflow release.yml --branch main --event workflow_dispatch --limit 5 \
                     --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$started\")][0].databaseId // empty")"
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::The Release run on main did not start."
            exit 1
          fi
          echo "Release run: https://github.com/$GH_REPO/actions/runs/$run"
          gh run watch "$run" --exit-status --interval 60
