name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs when the same PR is pushed again. Each push to main
# gets its own group so a burst of merges does not cancel the main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Checks only the lines a PR changes, so existing code is never reformatted
  # as a side effect of an unrelated change.
  format:
    name: format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Pinned so CI and contributors format identically; distro versions drift.
      - name: Install clang-format
        run: pipx install clang-format==23.1.1

      - name: Check formatting of changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          if ! out="$(git clang-format --diff --extensions h,hpp,cpp "$base" "$HEAD_SHA" -- include src)"; then
            echo "$out"
            echo "::error::Formatting differs from .clang-format. Run: git clang-format origin/$BASE_REF"
            exit 1
          fi
          echo "$out"

  build-ubuntu:
    name: build (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Ubuntu 24.04 ships Qt 6.4, the oldest Qt the launcher supports.
      # The runner's Azure mirror sometimes hangs or crawls; give up after a few minutes and try again
      # from the next mirror in the runner's list. Packages already downloaded are kept.
      - name: Install dependencies
        timeout-minutes: 25
        run: |
          packages=(
            build-essential cmake ninja-build pkg-config libgl-dev libcurl4-openssl-dev libsodium-dev nlohmann-json3-dev
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-l10n-tools
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs
            qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window
            qml6-module-qtqml-workerscript qml6-module-qt-labs-folderlistmodel qml6-module-qt-labs-platform
          )
          # Rebuilding the man page index after every package is slow and not needed here
          sudo rm -f /var/lib/man-db/auto-update
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              timeout 360 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends "${packages[@]}"; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt of 3 failed or hung"
            # A killed install may leave half-configured packages behind
            sudo dpkg --configure -a || true
            # The runner's sources pick the first entry of this mirror list
            if [ -f /etc/apt/apt-mirrors.txt ] && grep -q azure /etc/apt/apt-mirrors.txt; then
              sudo sed -i '/azure/d' /etc/apt/apt-mirrors.txt
              echo "Next attempt without the Azure mirror: $(head -n1 /etc/apt/apt-mirrors.txt)"
            fi
          done
          exit 1

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      # Offline: the tests serve channels.json and a placeholder translation from a local server
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-arch:
    name: build (arch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Rolling release: catches breakage with the newest Qt and compilers early.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja curl libsodium nlohmann-json qt6-base qt6-declarative qt6-tools

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Advisory only until the existing QML is warning-free.
      - name: Lint QML
        if: hashFiles('qml/*.qml') != ''
        continue-on-error: true
        run: /usr/lib/qt6/bin/qmllint -I build qml/*.qml
