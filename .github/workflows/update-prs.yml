name: Update PR branches

# After every change on main, brings all open PRs with auto-merge up to date,
# so they don't get stuck at "branch out of date". Needs the secret
# AUTOMERGE_TOKEN: updates made with GITHUB_TOKEN would not start the CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  # Queue instead of cancel: a cancelled run could leave a PR behind.
  cancel-in-progress: false

jobs:
  update:
    name: update behind PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Update auto-merge PRs that are behind main
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret AUTOMERGE_TOKEN is missing, PRs are not updated."
            exit 0
          fi
          # Right after a push, GitHub often reports mergeStateStatus as UNKNOWN, so
          # ask the compare API whether the head is behind the base instead.
          gh pr list --state open --json number,autoMergeRequest,baseRefName,headRefOid \
              --jq '.[] | select(.autoMergeRequest != null) | "\(.number) \(.baseRefName) \(.headRefOid)"' |
          while read -r n base head; do
            behind="$(gh api "repos/$GH_REPO/compare/$head...$base" --jq .ahead_by)"
            if [ "$behind" = "0" ]; then
              echo "#$n is up to date"
              continue
            fi
            echo "Updating #$n ($behind commits behind $base)"
            gh api -X PUT "repos/$GH_REPO/pulls/$n/update-branch" --silent \
              || echo "::warning::#$n could not be updated (conflict?)"
          done
