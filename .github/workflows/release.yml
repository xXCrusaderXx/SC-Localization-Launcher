name: Release

# Builds the AppImage, .deb, .rpm, Arch and Flatpak packages, installs and starts
# each of them on fresh distros, and publishes them as a GitHub Release.
#
# Ways to start it:
# - push a tag vX.Y.Z matching SC_DEFAULT_VERSION in CMakeLists.txt
# - call it from another workflow with a version (milestone-release.yml); it creates the tag itself
# - "Run workflow": without a version it is a dry run that publishes nothing
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_call:
    inputs:
      version:
        description: Release version without "v", e.g. 0.6.0
        type: string
        required: true
      notes:
        description: Release notes (Markdown); generated from the commits when empty
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Release version without "v" (empty = dry run, nothing is published)
        type: string
        required: false
        default: ""
      notes:
        description: Release notes (Markdown); generated from the commits when empty
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  version:
    name: check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Determine version
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          cmake_version="$(sed -n 's/^set(SC_DEFAULT_VERSION \([0-9][0-9.]*\)).*/\1/p' CMakeLists.txt)"
          if [ -n "$INPUT_VERSION" ]; then
            # Given by the caller; the build passes it to CMake, so CMakeLists.txt needs no bump
            version="${INPUT_VERSION#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Invalid version $INPUT_VERSION, expected X.Y.Z or X.Y.Z-suffix"
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$TAG" ]; then
            if [ "${TAG#v}" != "$cmake_version" ] && [[ "${TAG#v}" != "$cmake_version"-* ]]; then
              echo "::error::Tag $TAG does not match SC_DEFAULT_VERSION $cmake_version in CMakeLists.txt"
              exit 1
            fi
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$cmake_version" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  appimage:
    name: AppImage
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Oldest supported glibc; the AppImage then runs on every newer distro.
    container: ubuntu:22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build
        env:
          SC_VERSION_OVERRIDE: ${{ needs.version.outputs.version }}
        run: bash packaging/appimage/build.sh "$GITHUB_WORKSPACE"

      # Already named for the release: the .zsync file refers to the AppImage by this name
      - name: Collect
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          mv "build-appimage/SC-Localization-Launcher-$VERSION-x86_64.AppImage" \
             "build-appimage/SC-Localization-Launcher-$VERSION-x86_64.AppImage.zsync" dist/

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*

  # Built per distro: Ubuntu 24.04 packages depend on the t64 libraries Debian 12 does not have.
  native:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: deb (ubuntu 24.04), image: "ubuntu:24.04", suffix: ubuntu24.04, ext: deb }
          - { name: deb (debian 12), image: "debian:12", suffix: debian12, ext: deb }
          - { name: rpm (fedora), image: "fedora:latest", suffix: fedora, ext: rpm }
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build package
        env:
          SC_VERSION_OVERRIDE: ${{ needs.version.outputs.version }}
        run: bash packaging/native/build.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/out"

      - name: Rename
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          for f in out/*.${{ matrix.ext }}; do
            mv "$f" "dist/sc-localization-launcher-$VERSION-${{ matrix.suffix }}-x86_64.${{ matrix.ext }}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.suffix }}
          path: dist/*

  arch:
    name: arch package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The AUR PKGBUILD downloads the tag tarball; here it is built from this checkout instead.
      - name: Build PKGBUILD
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Arch versions must not contain "-"
          export PKGVER="${VERSION//-/_}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --prefix="SC-Localization-Launcher-$PKGVER/" -o /tmp/src.tar.gz HEAD
          bash packaging/aur/test.sh /tmp/src.tar.gz out
          mkdir dist
          mv out/*.pkg.tar.zst "dist/sc-localization-launcher-$VERSION-arch-x86_64.pkg.tar.zst"

      - uses: actions/upload-artifact@v7
        with:
          name: native-arch
          path: dist/*

  flatpak:
    name: Flatpak
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Signed repository for GitHub Pages (installs update through `flatpak update`) plus the single-file bundle.
      # Output inside the workspace: runner.temp is a different path inside a container job.
      - name: Build repository and bundle
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          REQUIRE_SIGNATURE: ${{ needs.version.outputs.publish }}
          VERSION: ${{ needs.version.outputs.version }}
        run: bash packaging/flatpak/build-repo.sh "$GITHUB_WORKSPACE" "$VERSION" flatpak-out

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: flatpak-out/*.flatpak

      - uses: actions/upload-pages-artifact@v5
        with:
          path: flatpak-out/site

  # Installs every package on a fresh distro without build tools and starts it under Xvfb.
  test:
    name: test ${{ matrix.name }}
    needs: [appimage, native, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: AppImage on ubuntu 22.04, image: "ubuntu:22.04", artifact: appimage, script: appimage/smoke-test.sh }
          - { name: AppImage on debian 12, image: "debian:12", artifact: appimage, script: appimage/smoke-test.sh }
          - { name: AppImage on fedora, image: "fedora:latest", artifact: appimage, script: appimage/smoke-test.sh }
          - { name: AppImage on arch, image: "archlinux:latest", artifact: appimage, script: appimage/smoke-test.sh }
          - { name: deb on ubuntu 24.04, image: "ubuntu:24.04", artifact: native-ubuntu24.04, script: native/install-test.sh }
          - { name: deb on debian 12, image: "debian:12", artifact: native-debian12, script: native/install-test.sh }
          - { name: rpm on fedora, image: "fedora:latest", artifact: native-fedora, script: native/install-test.sh }
          - { name: pkg on arch, image: "archlinux:latest", artifact: native-arch, script: native/install-test.sh }
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: pkg

      - name: Install and start
        run: |
          package="$(find "$PWD/pkg" -type f ! -name '*.zsync' | head -n 1)"
          chmod +x "$package"
          bash packaging/${{ matrix.script }} "$package" "$PWD/screenshot.png"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-${{ strategy.job-index }}
          path: screenshot.png
          if-no-files-found: ignore

  # Runs in dry runs too, so a secret that does not match packaging/minisign.pub shows up before a real release
  sign:
    name: checksums and signature
    needs: [version, test, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # For packaging/minisign.pub
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Only the packages and the AppImage update file, not the test screenshots
      - name: Collect packages
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.AppImage' -o -name '*.AppImage.zsync' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.pkg.tar.zst' -o -name '*.flatpak' \) -exec mv {} dist/ \;
          ls -la dist

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      # The launcher's self-update trusts a release only through this signature, so never publish without it
      - name: Checksums and signature
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Secret MINISIGN_SECRET_KEY is missing; releases are only published signed"
              exit 1
            fi
            echo "::warning::Secret MINISIGN_SECRET_KEY is missing; this dry run is not signed"
            exit 0
          fi
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          trap 'rm -f "$key"' EXIT

          minisign -S -s "$key" -m SHA256SUMS -t "sc-localization-launcher v$VERSION"
          # Catches a secret that does not belong to the public key the launcher ships
          minisign -V -p "$GITHUB_WORKSPACE/packaging/minisign.pub" -m SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/*

  publish:
    name: publish release
    needs: [version, sign]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist

      - name: Require the signature
        run: test -s dist/SHA256SUMS.minisig

      # For a tag push the tag exists; otherwise gh creates it on the commit that was built
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ inputs.notes || '' }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          args=(--title "$tag" --target "$GITHUB_SHA")
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); else args+=(--generate-notes); fi
          gh release create "$tag" "${args[@]}" dist/*

  # After the GitHub Release, so the repository never offers a version whose release page does not exist yet
  pages:
    name: publish Flatpak repository
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # yay/paru users get the release through the AUR; skipped with a warning while the account's key is not set up
  aur:
    name: publish AUR package
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Publish PKGBUILD
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: bash packaging/aur/publish.sh "$VERSION"

