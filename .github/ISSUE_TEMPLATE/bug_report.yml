name: Bug report
description: The launcher does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Wrong German texts belong in [StarCitizen-Deutsch-INI](https://github.com/rjcncpt/StarCitizen-Deutsch-INI/issues), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the launcher
        2. Click "Update" on PTU
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      placeholder: e.g. 0.1.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Installation type
      options:
        - AppImage
        - .deb
        - .rpm
        - Flatpak
        - Built from source
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      placeholder: e.g. Arch Linux, KDE Plasma 6 (Wayland)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Start the launcher from a terminal and paste the output. Remove personal paths if you want.
      render: text
